name: Docker Build

on:
  workflow_call:
    inputs:
      docker-registry:
        description: Docker registry
        default: ghcr.io
        required: false
        type: string
      docker-repo:
        description: Docker repository
        default: ${{ github.repository_owner }}
        required: false
        type: string
      docker-image:
        description: Docker image name
        required: true
        type: string
      docker-platform:
        description: Docker platform(s) to build for
        default: linux/amd64,linux/arm64
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      with:
        platforms: arm64
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        platforms: ${{ inputs.docker-platform }}
    - name: Login to Docker registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.docker-registry }}/${{ inputs.docker-repo }}/${{ inputs.docker-image }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=raw,value={{branch}}-{{date 'YYYY.MM.DD'}}-{{sha}},enable=${{ github.ref_type != 'tag' }}
    - name: Build and push image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: ${{ inputs.docker-platform }}
        push: ${{ !startsWith(github.ref, 'refs/heads/dependabot/') }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
